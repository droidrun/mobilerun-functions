[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mobilerun-routines"
dynamic = ["version"]
description = "Script interface for Mobilerun routine scripts: typed entry point, Context, inspect and run."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic>=2.11"]

[project.optional-dependencies]
device = ["mobilerun-core>=1.10.1,<2"]
local = ["mobilerun-core[local]>=1.12.0,<2"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.version]
path = "mobilerun_routines/_version.py"
pattern = 'SDK_VERSION = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["mobilerun_routines"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.mypy.overrides]]
module = "mobilerun_core"
ignore_missing_imports = true
